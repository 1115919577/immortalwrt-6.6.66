config smartdns
	option server_name 'smartdns'
	option dualstack_ip_selection '1'
	option prefetch_domain '1'
	option serve_expired '1'
	option seconddns_no_cache '0'
	option tcp_server '0'
	option seconddns_tcp_server '0'
	option coredump '0'
	option ipv6_server '0'
	option seconddns_port '5335'
	option seconddns_server_group 'word'
	option seconddns_enabled '0'
	option seconddns_no_rule_addr '0'
	option seconddns_no_rule_nameserver '0'
	option seconddns_no_rule_ipset '0'
	option seconddns_no_rule_soa '0'
	option cache_size '1000'
	option rr_ttl_min '600'
	option resolve_local_hostnames '1'
	option force_aaaa_soa '0'
	option force_https_soa '0'
	option auto_set_dnsmasq '1'
	option port '6053'
	option enabled '0'
	option speed_check_mode 'tcp:443,tcp:80,ping'
	option bind_device '1'
	option enable_auto_update '1'
	option seconddns_no_speed_check '1'
	option seconddns_no_dualstack_selection '1'
	option seconddns_force_aaaa_soa '1'
	option cache_persist '1'
	option auto_update_day_time '5'
	option auto_update_week_time '1'
	list conf_files 'anti-ad-smartdns.conf'

config domain-rule

config download-file
	option type 'config'
	option name 'anti-ad-smartdns.conf'
	option url 'https://anti-ad.net/anti-ad-for-smartdns.conf'
