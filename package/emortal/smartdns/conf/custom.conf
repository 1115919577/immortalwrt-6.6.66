# Add custom settings here.

# set log level
# log-level [level], level=fatal, error, warn, notice, info, debug
log-level info

# log-size k,m,g
log-size 512k

# log-file /var/log/smartdns.log
# log-num 2

# List of hosts that supply bogus NX domain results
# bogus-nxdomain [ip/subnet]

dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

# bootstrap
server-https https://223.6.6.6/dns-query -bootstrap-dns
server-tls 223.6.6.6 -bootstrap-dns

# 默认组
#server-https https://1.0.0.1/dns-query
#server-tls 1.0.0.1
server-https https://cloudflare-dns.com/dns-query
server-tls 1dot1dot1dot1.cloudflare-dns.com
server-https https://dns.google/dns-query
server-tls dns.google

# 国内组
#server-https https://dns.alidns.com/dns-query -group cn -exclude-default-group
#server-tls dns.alidns.com -group cn -exclude-default-group
server-https https://doh.pub/dns-query -group cn -exclude-default-group
server-tls dot.pub -group cn -exclude-default-group
server-https https://doh.360.cn/dns-query -group cn -exclude-default-group
server-tls dot.360.cn -group cn -exclude-default-group

# 国外组(配合PSW第二组暂不用)
#server-https https://1.1.1.1/dns-query -group word -exclude-default-group
#server-tls 1.1.1.1 -group word -exclude-default-group
#server-https https://1.0.0.1/dns-query -group word -exclude-default-group
#server-tls 1.0.0.1 -group word -exclude-default-group
#server-https https://cloudflare-dns.com/dns-query -group word -exclude-default-group
#server-tls 1dot1dot1dot1.cloudflare-dns.com -group word -exclude-default-group
#server-https https://dns.google/dns-query -group word -exclude-default-group
#server-tls dns.google -group word -exclude-default-group
#server-https https://dns.quad9.net/dns-query -group word -exclude-default-group
#server-tls dns.quad9.net -group word -exclude-default-group
#server-https https://doh.opendns.com/dns-query -group word -exclude-default-group

# 排除IPV6
#address /mudvod.tv/#6

# 广告过滤
#conf-file /etc/smartdns/conf.d/anti-ad-smartdns.conf
address /sdup.update.360safe.com/-

